<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Architecture Toolbox</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/cytoscape.min.js"></script>
  <script src="/chroma.min.js"></script>
</head>
<body>
  <header>
    <h1>Architecture Toolbox</h1>
    <div class="controls">
      <label>Depth <input id="depth" type="range" min="1" max="6" value="2" /></label>
      <select id="scope">
        <option value="">All packages</option>
      </select>
      <input id="search" type="search" placeholder="Search nodes…" />
      <select id="group">
        <option value="package">Group: Package</option>
        <option value="class">Group: Class</option>
      </select>
      <select id="overlay">
        <option value="none">Overlay: None</option>
        <option value="hotspot">Hotspots</option>
        <option value="busfactor">Bus factor</option>
        <option value="coupling">Coupling</option>
      </select>
    </div>
  </header>
  <main id="workspace">
    <div id="graph-area">
      <div id="cy"></div>
      <button id="panel-open" type="button" class="panel-fab" hidden aria-label="Open metrics panel">◀ Metrics</button>
    </div>
    <div id="panel-resizer" role="separator" aria-orientation="vertical" aria-label="Resize metrics panel"></div>
    <aside id="panel">
      <div class="panel-toolbar">
        <nav class="tabs">
          <button data-tab="hotspots" class="active">Hotspots</button>
          <button data-tab="coupling">Coupling</button>
          <button data-tab="busfactor">Bus factor</button>
        </nav>
        <button id="panel-close" type="button" class="panel-toggle" aria-label="Collapse metrics panel" title="Collapse panel">›</button>
      </div>
      <div id="tab-hotspots" class="tab active"></div>
      <div id="tab-coupling" class="tab"></div>
      <div id="tab-busfactor" class="tab"></div>
    </aside>
  </main>
  <div id="tooltip"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
